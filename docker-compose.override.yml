# Auto-loaded by Docker Compose on top of docker-compose.yml.
# Runs the frontend in Vite dev mode with hot-reload, mounting your
# host source so edits show up instantly without rebuilding the image.
#
# Delete this file (or rename it) to fall back to the production nginx build.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0 --port 3000
    ports: !override
      # Host 5174 (not Vite's default 5173) so this stack can run alongside
      # another Vite app that owns 5173. The container still serves on 3000;
      # only the published host port changed. Keep it in sync with
      # app.cors.allowed-origins in backend/src/main/resources/application.yml.
      - "5174:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
      VITE_USE_POLLING: "true"
    depends_on:
      - backend
    networks:
      - fyp-network
