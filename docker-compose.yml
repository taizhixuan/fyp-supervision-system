services:
  db:
    image: mysql:8
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: fyp_supervision
      MYSQL_USER: fyp_user
      MYSQL_PASSWORD: fyp_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fyp-network

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://db:3306/fyp_supervision?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: fyp_user
      DB_PASS: fyp_pass
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-must-be-at-least-32-characters-long-for-hs256}
      JWT_EXPIRY_MS: ${JWT_EXPIRY_MS:-86400000}
      FILE_UPLOAD_DIR: /app/uploads
      AI_RECOMMENDATION_URL: http://ai-recommendation:5001
      AI_ANALYZER_URL: http://ai-proposal-analyzer:5002
      AI_CHATBOT_URL: http://ai-chatbot:5003
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      APP_EMAIL_ENABLED: ${APP_EMAIL_ENABLED:-false}
      APP_EMAIL_FROM: ${APP_EMAIL_FROM:-fyp-noreply@mmu.edu.my}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      # 5174 is the dev frontend's host port (see docker-compose.override.yml);
      # 3000 is the nginx prod build. Read at runtime, so no image rebuild needed.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:5174}
      TZ: ${TZ:-Asia/Kuala_Lumpur}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - upload_data:/app/uploads
    networks:
      - fyp-network

  ai-recommendation:
    build: ./ai-recommendation
    ports:
      - "5001:5001"
    environment:
      FLASK_PORT: "5001"
      # Embedding model. Default is BAAI/bge-base-en-v1.5 (110 MB, 768-dim).
      # Override to all-MiniLM-L6-v2 for a smaller, faster fallback.
      REC_EMBED_MODEL: ${REC_EMBED_MODEL:-BAAI/bge-base-en-v1.5}
      # Optional weight overrides (defaults are sane).
      REC_W_SEMANTIC: ${REC_W_SEMANTIC:-}
      REC_W_INTEREST: ${REC_W_INTEREST:-}
      REC_W_SKILL: ${REC_W_SKILL:-}
      REC_W_PROGRAMME: ${REC_W_PROGRAMME:-}
      REC_W_AVAILABILITY: ${REC_W_AVAILABILITY:-}
    volumes:
      - recommendation_models:/app/models
    networks:
      - fyp-network

  ai-proposal-analyzer:
    build: ./ai-proposal-analyzer
    ports:
      - "5002:5002"
    environment:
      FLASK_PORT: "5002"
      # LLM provider (see llm_provider.py). LLM_PROVIDER picks one of
      # ollama | groq | openai | custom | none. Left blank, the first key found
      # wins (LLM_API_KEY, GROQ_API_KEY, OPENAI_API_KEY), else none.
      # The admin can switch provider at runtime in Integration Settings.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
    volumes:
      - analyzer_models:/app/models
    networks:
      - fyp-network

  ai-chatbot:
    build: ./ai-chatbot
    ports:
      - "5003:5003"
    environment:
      FLASK_PORT: "5003"
      USE_LOCAL_GEN: "false"
      # LLM provider (see llm_provider.py). LLM_PROVIDER picks one of
      # ollama | groq | openai | custom | none. Left blank, the first key found
      # wins (LLM_API_KEY, GROQ_API_KEY, OPENAI_API_KEY), else none.
      # The admin can switch provider at runtime in Integration Settings.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
    volumes:
      - chatbot_vector_store:/app/vector_store
    networks:
      - fyp-network

  # Local LLM server. Opt-in: `docker compose --profile local-llm up -d`.
  # Point OLLAMA_VOLUME at an existing Ollama volume to reuse models you've
  # already pulled; otherwise pull with `docker compose exec ollama ollama pull llama3.2:3b`.
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.33.2}
    profiles: ["local-llm"]
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - fyp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - fyp-network

volumes:
  mysql_data:
  upload_data:
  recommendation_models:
  analyzer_models:
  chatbot_vector_store:
  ollama_data:
    name: ${OLLAMA_VOLUME:-fyp_ollama_data}

networks:
  fyp-network:
    driver: bridge
