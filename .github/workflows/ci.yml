# Runs the backend test suite + the frontend build (and lint) on every push and PR.
# Jobs are independent; they run in parallel. Caches Maven and npm deps so warm runs
# finish in ~1 minute. Backend tests are pure Mockito (no DB needed) so no services.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel any in-flight run for the same ref when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B -ntp test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        # Treat warnings as errors (project policy in package.json: --max-warnings 0).
        run: npm run lint

      - name: Build
        # `npm run build` here is `vite build` only — tsc was removed because of
        # pre-existing strict errors. The vite build still type-checks JSX and
        # surfaces unresolved imports, which is what matters in CI.
        run: npm run build
