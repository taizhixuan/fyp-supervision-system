# Production-style overlay that puts Caddy in front of the stack, removes the
# direct host port mappings, and switches critical secrets from `.env` to
# Docker secrets. Compose merges this on top of docker-compose.yml when you
# pass it explicitly:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The dev-only docker-compose.override.yml is NOT auto-loaded by this command
# (only `up` without -f loads it), so the production nginx frontend image is
# used as intended.
#
# Required files before first `up` (each one line of plaintext, no trailing newline):
#   secrets/jwt_secret.txt        generate:  openssl rand -base64 48
#   secrets/db_password.txt       generate:  openssl rand -base64 24
#   secrets/db_root_password.txt  generate:  openssl rand -base64 24
#
# These are mounted into the containers at /run/secrets/<name>; backend / mysql
# read them via the standard *_FILE env var convention.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - fyp-network

  # MySQL reads passwords from files via the official image's *_FILE convention.
  db:
    environment:
      # The base compose sets MYSQL_PASSWORD + MYSQL_ROOT_PASSWORD as plain strings.
      # Docker Compose merges environment by key, so without explicit nulls here both
      # the plain var AND the _FILE var would be passed to the container — the
      # official mysql:8 entrypoint refuses to start in that case. Empty string is
      # treated as "unset" by the entrypoint's file_env() check, so the _FILE form
      # is the one that wins.
      MYSQL_PASSWORD: ""
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      # MYSQL_USER + MYSQL_DATABASE inherited from the base file — those are not secret.
    secrets:
      - db_password
      - db_root_password

  # Stop publishing the frontend on the host — Caddy reaches it on the
  # internal docker network instead. Also rebuild with the proxied API URL
  # so the SPA calls https://api.localhost/api at runtime.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://api.localhost/api
    ports: !override []

  backend:
    ports: !override []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_BASE_URL: https://app.localhost
      APP_CORS_ALLOWED_ORIGINS: https://app.localhost
      # JWT secret and DB password are loaded from secret files by the entrypoint
      # script (backend/docker-entrypoint.sh): JWT_SECRET_FILE → JWT_SECRET, etc.
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      DB_PASS_FILE: /run/secrets/db_password
    secrets:
      - jwt_secret
      - db_password

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt

volumes:
  caddy_data:
  caddy_config:
